<!DOCTYPE html>
<html lang="{{ site.lang | default: 'tr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta name="theme-color" content="#064984">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ site.title }}: {{ site.tagline }}">
  <meta property="og:description" content="{{ site.description | strip_newlines | strip }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/img/og-image.png' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" sizes="64x64" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <link rel="preload" href="{{ '/assets/fonts/barlow-condensed-latin-700-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/ibm-plex-sans-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script>document.documentElement.classList.add("js");</script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "{{ site.title }}",
    "url": "{{ site.url }}{{ site.baseurl }}/",
    "logo": "{{ '/assets/img/logo.png' | absolute_url }}",
    "description": "{{ site.description | strip_newlines | strip }}"{% if site.linkedin != "" %},
    "sameAs": ["{{ site.linkedin }}"]{% endif %}
  }
  </script>
</head>
<body>
  <a class="skip" href="#icerik">Ana içeriğe geç</a>

  <header class="site-header" data-header>
    <div class="wrap header-row">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} ana sayfa">
        <img class="brand-logo" src="{{ '/assets/img/logo.png' | relative_url }}" alt="{{ site.title }}" width="173" height="38">
      </a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="ana-menu" data-nav-toggle>
        <span class="nav-toggle-bars" aria-hidden="true"></span>
        <span class="sr-only">Menüyü aç/kapat</span>
      </button>

      <nav id="ana-menu" class="nav" aria-label="Ana menü" data-nav>
        <a href="#urunler">Ürünler</a>
        <a href="#neden">Neden Codnapp</a>
        <a href="#ekip">Biz</a>
        <a class="nav-cta" href="#iletisim">İletişim</a>
      </nav>
    </div>
  </header>

  <main id="icerik">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <div>
        <img class="footer-logo" src="{{ '/assets/img/logo-white.png' | relative_url }}" alt="{{ site.title }}" width="140" height="31" loading="lazy">
        <p>&copy; {{ 'now' | date: '%Y' }} {% if site.iletisim.resmi_unvan != "" %}{{ site.iletisim.resmi_unvan }}{% else %}{{ site.title }}{% endif %}{% if site.iletisim.vergi_dairesi_no != "" %}<br><span class="muted">{{ site.iletisim.vergi_dairesi_no }}</span>{% endif %}</p>
      </div>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
